# Open the project's repository on GitHub. `gh browse` finds it from the git
# remotes, and fails for a project that isn't on GitHub (a notification says so).
name = "GitHub"
description = "Open the project's repository on GitHub"
type = "command"
command = "cd '{{.WorkDir}}' && url=$(gh browse --no-browser 2>/dev/null) && omarchy-launch-browser \"$url\" || notify-send 'GitHub' 'This project has no GitHub remote.'"

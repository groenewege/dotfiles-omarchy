# Copied to /etc/systemd/logind.conf.d/50-dotfiles-lid.conf by
# scripts/80-remote-access.sh. This machine is a server for the Mac: on the
# charger, closing the lid keeps it awake (and reachable). On battery it still
# suspends, so it doesn't run hot in a bag.
[Login]
HandleLidSwitchExternalPower=ignore

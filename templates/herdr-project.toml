# herdr-plus project template. Copy it per project:
#   cp templates/herdr-project.toml \
#     ~/.config/herdr/plugins/config/cloudmanic.herdr-plus/projects/my-app.toml
# Then prefix+up in herdr opens the project picker. open-project uses T3 Code
# instead, so this is only for projects you also want in herdr.
name = "my-app"
description = "laravel project"
working_dir = "~/Sites/my-app"

[[tabs]]
name = "claude"
command = "claude"

[[tabs]]
name = "lazygit"
command = "lazygit"

[[tabs]]
name = "db"
command = "project-db"

[[tabs]]
name = "terminal"
